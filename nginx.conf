user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##
	server {
		listen 80;
		server_name npk-archive.space;
		root /var/www/html;

		# Trust Cloudflare (and/or your proxy). Use 127.0.0.1 if traffic reaches nginx from localhost.
		set_real_ip_from 127.0.0.1;
		# Optional: trust Cloudflare's IP ranges so only they can set the real IP
		# include /etc/nginx/cloudflare.conf;  # if you have a file with set_real_ip_from for CF IPs

		# Use Cloudflare's header for the real client IP
		real_ip_header CF-Connecting-IP;

		# Frontend (index.html, firmware.json) in /var/www/html
		location / {
			try_files $uri $uri/ /index.html;
		}

		# Firmware: serve NPK files from downloads directory (explicit locations fix 404 on download)
		location /long_term/ {
			alias /var/www/html/downloads/long_term/;
		}
		location /stable/ {
			alias /var/www/html/downloads/stable/;
		}
		location /testing/ {
			alias /var/www/html/downloads/testing/;
		}
		location /dev/ {
			alias /var/www/html/downloads/dev/;
		}
	}
	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off; # Recommended practice is to turn this off

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3 (POODLE), TLS 1.0, 1.1
	ssl_prefer_server_ciphers off; # Don't force server cipher order.

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;
}


